<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
html,body{margin:0}
body{width:1200px;height:630px;background:#0B0B0C;color:#F3EEE5;font-family:'Cormorant Garamond','Times New Roman',serif;position:relative;overflow:hidden}
.ghost{position:absolute;left:0;right:0;top:110px;text-align:center;font-size:300px;line-height:1;letter-spacing:.04em;color:#171613}
.line{position:absolute;left:599px;top:70px;width:1px;height:150px;background:linear-gradient(#C9A96E,rgba(201,169,110,0))}
.wrap{position:absolute;left:80px;bottom:110px;text-align:left}
.loc{font-size:20px;letter-spacing:.5em;color:#C9A96E;margin:0 0 22px}
.name{font-size:110px;letter-spacing:.02em;margin:0;line-height:.92;font-weight:500;background:linear-gradient(180deg,#F6E7C1,#DCC089 45%,#A88545);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.rule{width:64px;height:1px;background:#C9A96E;margin:28px 0}
.copy{font-size:34px;letter-spacing:.08em;margin:0;color:#EDE8DF}
.frame{position:absolute;inset:24px;border:1px solid #2A2722}
</style>
</head>
<body>
<img src="hero.jpg" style="position:absolute;right:0;top:0;width:560px;height:630px;object-fit:cover;object-position:50% 22%">
<div style="position:absolute;inset:0;background:linear-gradient(to right,#0B0B0C 50%,rgba(11,11,12,.6) 60%,rgba(11,11,12,0) 78%)"></div>
<div class="wrap">
<p class="loc">NAGOYA, JAPAN</p>
<p class="name">FUMIYA<br>STYLE</p>
<div class="rule"></div>
<p class="copy">Your Vision. Our Commitment.</p>
</div>
</body>
</html>
