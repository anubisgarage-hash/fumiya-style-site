# FUMIYA STYLE — static pages in /public, 参考実例 (works) rendered by functions.
# No build step: public/ is generated locally by tools/build.py and committed.
[build]
  base = ""
  publish = "public"
  command = "echo \"no build step: public/ is pre-built\""

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/_lib/*.html", "netlify/functions/_lib/*.json"]

# Old static branding page now lives at /branding/ (server-rendered with latest works)
[[redirects]]
  from = "/branding.html"
  to = "/branding/"
  status = 301
  force = true

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
